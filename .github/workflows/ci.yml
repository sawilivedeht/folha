name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Em PR, um push novo cancela o anterior; na main, todo commit termina (o APK fica como artefato).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web (typecheck, testes, build, E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Instalar Chromium do Playwright
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium
      - name: Testes E2E
        if: hashFiles('playwright.config.ts') != ''
        run: npm run test:e2e

  android:
    name: Android (APK debug, release e lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Instalar plataforma do Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK debug e release (R8) e rodar lint
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease lint
      - uses: actions/upload-artifact@v4
        with:
          name: folha-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
